<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Car Parking System | Complete Solution</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
      --dark: #0f172a;
      --gray: #64748b;
      --light: #f8fafc;
      --white: #ffffff;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      background: var(--white);
      border-radius: 20px;
      padding: 25px 30px;
      margin-bottom: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .badge {
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f1f5f9;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.4); }
      70% { box-shadow: 0 0 0 10px rgba(16,185,129,0); }
      100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }

    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--white);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 30px rgba(0,0,0,0.1);
    }

    .stat-info h3 {
      font-size: 14px;
      color: var(--gray);
      margin-bottom: 8px;
    }

    .stat-number {
      font-size: 32px;
      font-weight: 700;
      color: var(--dark);
    }

    .stat-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
    }

    /* Parking Grid */
    .parking-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin-bottom: 30px;
    }

    .slot-card {
      background: var(--white);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      border-left: 5px solid;
      transition: all 0.3s;
    }

    .slot-card.available { border-left-color: var(--success); }
    .slot-card.booked { border-left-color: var(--warning); }
    .slot-card.occupied { border-left-color: var(--danger); }

    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .slot-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slot-title i {
      font-size: 24px;
      color: var(--primary);
    }

    .slot-title h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .slot-badge {
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .slot-badge.available { background: #d1fae5; color: #065f46; }
    .slot-badge.booked { background: #fed7aa; color: #92400e; }
    .slot-badge.occupied { background: #fee2e2; color: #991b1b; }

    .vehicle-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      margin: 15px 0;
      transition: all 0.3s;
    }

    .vehicle-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(37,99,235,0.3);
    }

    .btn-warning {
      background: var(--warning);
      color: white;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .timer-box {
      margin-top: 15px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 12px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Logs Section */
    .logs-section {
      background: var(--white);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }

    .logs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logs-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logs-title i {
      font-size: 28px;
      color: var(--primary);
    }

    .logs-title h2 {
      font-size: 24px;
      font-weight: 700;
    }

    .filter-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-input {
      padding: 10px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      min-width: 200px;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #f8fafc;
      padding: 16px;
      text-align: left;
      font-weight: 600;
      color: var(--dark);
      border-bottom: 2px solid #e2e8f0;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid #e2e8f0;
    }

    tr:hover td {
      background: #f8fafc;
    }

    .vehicle-tag {
      background: #e2e8f0;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
    }

    .duration-tag {
      background: #dbeafe;
      color: #1e40af;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
    }

    .fee-tag {
      background: #10b981;
      color: white;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
    }

    /* Notification */
    .notification {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 16px 24px;
      border-radius: 12px;
      color: white;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateX(400px);
      transition: transform 0.3s;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .notification.show {
      transform: translateX(0);
    }

    .notification.success { background: var(--success); }
    .notification.warning { background: var(--warning); }
    .notification.error { background: var(--danger); }
    .notification.info { background: var(--info); }

    @media (max-width: 768px) {
      .header { flex-direction: column; text-align: center; }
      .stats-grid { grid-template-columns: 1fr; }
      .filter-group { width: 100%; }
      .filter-input { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div>
        <h1><i class="fas fa-parking"></i> Smart Car Parking System</h1>
        <p style="color: var(--gray); margin-top: 5px;">Complete Solution with All Functions Working</p>
      </div>
      <div class="status-badge">
        <div class="badge">
          <span class="dot"></span>
          <span id="systemStatus">System Online</span>
        </div>
        <div class="badge">
          <i class="fas fa-wifi"></i>
          <span id="wifiStatus">Connected</span>
        </div>
        <div class="badge">
          <i class="fas fa-clock"></i>
          <span id="currentTime"></span>
        </div>
      </div>
    </div>

    <!-- Statistics -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-info">
          <h3>Total Slots</h3>
          <div class="stat-number">5</div>
        </div>
        <div class="stat-icon">
          <i class="fas fa-parking"></i>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <h3>Available</h3>
          <div class="stat-number" id="availableCount">0</div>
        </div>
        <div class="stat-icon" style="background: var(--success);">
          <i class="fas fa-check"></i>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <h3>Booked</h3>
          <div class="stat-number" id="bookedCount">0</div>
        </div>
        <div class="stat-icon" style="background: var(--warning);">
          <i class="fas fa-bookmark"></i>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <h3>Occupied</h3>
          <div class="stat-number" id="occupiedCount">0</div>
        </div>
        <div class="stat-icon" style="background: var(--danger);">
          <i class="fas fa-car"></i>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <h3>Today's Revenue</h3>
          <div class="stat-number" id="todayRevenue">₹0</div>
        </div>
        <div class="stat-icon" style="background: var(--info);">
          <i class="fas fa-rupee-sign"></i>
        </div>
      </div>
    </div>

    <!-- Parking Slots -->
    <div class="parking-grid" id="parkingGrid"></div>

    <!-- Parking Logs -->
    <div class="logs-section">
      <div class="logs-header">
        <div class="logs-title">
          <i class="fas fa-history"></i>
          <h2>Parking Session Logs</h2>
        </div>
        <div class="filter-group">
          <input type="text" id="filterVehicle" class="filter-input" placeholder="🔍 Filter by vehicle" onkeyup="filterLogs()">
          <input type="text" id="filterSlot" class="filter-input" placeholder="🔍 Filter by slot" onkeyup="filterLogs()">
          <button class="btn btn-primary" onclick="exportCSV()">
            <i class="fas fa-file-csv"></i> Export CSV
          </button>
          <button class="btn btn-primary" onclick="clearFilters()">
            <i class="fas fa-eraser"></i> Clear
          </button>
        </div>
      </div>
      <div class="table-container">
        <table id="logsTable">
          <thead>
            <tr>
              <th>Slot</th>
              <th>Vehicle</th>
              <th>Booking Time</th>
              <th>Pre-Booking</th>
              <th>Parking Duration</th>
              <th>Fee (₹)</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="logTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Notification -->
  <div id="notification" class="notification">
    <i id="notificationIcon" class="fas fa-info-circle"></i>
    <span id="notificationMessage"></span>
  </div>

  <script>
    // ============ FIREBASE CONFIGURATION ============
    const firebaseConfig = {
      apiKey: "AIzaSyBMLxyco3ZJsY_exarrv1or2ayxUHq27A8",
      authDomain: "smart-car-parking-a6245.firebaseapp.com",
      databaseURL: "https://smart-car-parking-a6245-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "smart-car-parking-a6245",
      storageBucket: "smart-car-parking-a6245.firebasestorage.app",
      messagingSenderId: "465653410219",
      appId: "1:465653410219:web:159363eef141a96b234aee"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // ============ GLOBAL VARIABLES ============
    const PARKING_RATE = 20; // ₹20 per hour
    let allLogs = [];
    let timers = {};
    let occupationStartTimes = {};

    // ============ NOTIFICATION SYSTEM ============
    function showNotification(message, type = 'success') {
      const notification = document.getElementById('notification');
      const notificationMessage = document.getElementById('notificationMessage');
      const notificationIcon = document.getElementById('notificationIcon');
      
      notification.className = `notification ${type}`;
      notificationMessage.textContent = message;
      
      switch(type) {
        case 'success': notificationIcon.className = 'fas fa-check-circle'; break;
        case 'warning': notificationIcon.className = 'fas fa-exclamation-triangle'; break;
        case 'error': notificationIcon.className = 'fas fa-times-circle'; break;
        default: notificationIcon.className = 'fas fa-info-circle';
      }
      
      notification.classList.add('show');
      setTimeout(() => notification.classList.remove('show'), 3000);
    }

    // ============ TIME FORMATTING ============
    function formatTime(timestamp) {
      if (!timestamp) return '-';
      const date = new Date(parseInt(timestamp));
      return date.toLocaleString('en-IN', {
        day: '2-digit',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      });
    }

    function formatDuration(ms) {
      if (!ms) return '-';
      const seconds = Math.floor(ms / 1000);
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      
      if (hours > 0) return `${hours}h ${minutes}m ${secs}s`;
      if (minutes > 0) return `${minutes}m ${secs}s`;
      return `${secs}s`;
    }

    function calculateFee(occupyTime, vacateTime) {
      if (!occupyTime || !vacateTime) return 0;
      const durationHours = (parseInt(vacateTime) - parseInt(occupyTime)) / (1000 * 60 * 60);
      return Math.ceil(durationHours * PARKING_RATE);
    }

    // ============ BOOK SLOT FUNCTION ============
    window.bookSlot = async function(slotId) {
      const input = document.getElementById(`vehicle-${slotId}`);
      const vehicleNumber = input.value.trim();
      
      if (!vehicleNumber) {
        showNotification('Please enter vehicle number!', 'warning');
        return;
      }
      
      if (vehicleNumber.length < 4) {
        showNotification('Vehicle number must be at least 4 characters!', 'warning');
        return;
      }
      
      try {
        const bookingTime = Date.now().toString();
        
        await database.ref(`slots/${slotId}`).update({
          status: 'booked',
          vehicle: vehicleNumber.toUpperCase(),
          bookingTime: bookingTime,
          occupyTime: null,
          vacateTime: null,
          lastUpdate: Date.now().toString()
        });
        
        // Send command to ESP32 for buzzer
        await database.ref('system/commands').set({
          buzzer: 'single',
          timestamp: Date.now().toString(),
          slot: slotId,
          vehicle: vehicleNumber.toUpperCase()
        });
        
        input.value = '';
        showNotification(`✅ Slot ${slotId} booked successfully!`, 'success');
        
      } catch (error) {
        console.error('Booking error:', error);
        showNotification('❌ Booking failed: ' + error.message, 'error');
      }
    };

    // ============ CANCEL BOOKING FUNCTION ============
    window.cancelBooking = async function(slotId) {
      if (!confirm(`Are you sure you want to cancel booking for ${slotId}?`)) return;
      
      try {
        await database.ref(`slots/${slotId}`).update({
          status: 'free',
          vehicle: '',
          bookingTime: null,
          lastUpdate: Date.now().toString()
        });
        
        showNotification(`✅ Booking cancelled for ${slotId}`, 'success');
        
      } catch (error) {
        console.error('Cancel error:', error);
        showNotification('❌ Cancellation failed: ' + error.message, 'error');
      }
    };

    // ============ RELEASE SLOT FUNCTION ============
    window.releaseSlot = async function(slotId) {
      if (!confirm(`Manually release slot ${slotId}?`)) return;
      
      try {
        const snapshot = await database.ref(`slots/${slotId}`).once('value');
        const slotData = snapshot.val();
        
        await database.ref(`slots/${slotId}`).update({
          status: 'free',
          vehicle: '',
          bookingTime: null,
          vacateTime: Date.now().toString(),
          lastUpdate: Date.now().toString()
        });
        
        showNotification(`✅ Slot ${slotId} released`, 'success');
        
      } catch (error) {
        console.error('Release error:', error);
        showNotification('❌ Release failed: ' + error.message, 'error');
      }
    };

    // ============ UPDATE STATISTICS ============
    function updateStatistics(slotsData) {
      let available = 0, booked = 0, occupied = 0;
      
      Object.values(slotsData || {}).forEach(slot => {
        if (slot.status === 'free') available++;
        else if (slot.status === 'booked') booked++;
        else if (slot.status === 'occupied') occupied++;
      });
      
      document.getElementById('availableCount').textContent = available;
      document.getElementById('bookedCount').textContent = booked;
      document.getElementById('occupiedCount').textContent = occupied;
      
      // Calculate today's revenue
      const today = new Date().setHours(0, 0, 0, 0);
      let revenue = 0;
      
      allLogs.forEach(log => {
        if (log.vacateTime && parseInt(log.vacateTime) >= today) {
          revenue += calculateFee(log.occupyTime, log.vacateTime);
        }
      });
      
      document.getElementById('todayRevenue').textContent = `₹${revenue}`;
    }

    // ============ RENDER PARKING SLOTS ============
    function renderParkingSlots(slotsData) {
      const grid = document.getElementById('parkingGrid');
      grid.innerHTML = '';
      
      const slotOrder = ['slot1', 'slot2', 'slot3', 'slot4', 'slot5'];
      
      slotOrder.forEach(slotId => {
        const slot = slotsData[slotId] || { status: 'free', vehicle: '', bookingTime: null };
        const card = document.createElement('div');
        card.className = `slot-card ${slot.status}`;
        card.id = slotId;
        
        // Clear existing timer
        if (timers[slotId]) {
          clearInterval(timers[slotId]);
          delete timers[slotId];
        }
        
        // Header
        let header = `
          <div class="slot-header">
            <div class="slot-title">
              <i class="fas fa-parking"></i>
              <h2>${slotId.toUpperCase()}</h2>
            </div>
            <span class="slot-badge ${slot.status}">
              ${slot.status === 'free' ? 'AVAILABLE' : slot.status === 'booked' ? 'BOOKED' : 'OCCUPIED'}
            </span>
          </div>
        `;
        
        // Info
        let info = '';
        if (slot.status === 'booked') {
          info = `
            <div class="slot-info" style="margin: 15px 0; padding: 15px; background: #fff7ed; border-radius: 12px;">
              <p><i class="fas fa-car"></i> <strong>Vehicle:</strong> ${slot.vehicle || 'N/A'}</p>
              <p><i class="fas fa-clock"></i> <strong>Booked:</strong> ${formatTime(slot.bookingTime)}</p>
            </div>
          `;
        } else if (slot.status === 'occupied') {
          info = `
            <div class="slot-info" style="margin: 15px 0; padding: 15px; background: #fef2f2; border-radius: 12px;">
              <p><i class="fas fa-car"></i> <strong>Vehicle:</strong> ${slot.vehicle || 'UNKNOWN'}</p>
              <p><i class="fas fa-clock"></i> <strong>Since:</strong> ${formatTime(slot.occupyTime)}</p>
            </div>
          `;
        }
        
        // Actions
        let actions = '';
        if (slot.status === 'free') {
          actions = `
            <input type="text" id="vehicle-${slotId}" class="vehicle-input" placeholder="Enter vehicle number" autocomplete="off">
            <button onclick="bookSlot('${slotId}')" class="btn btn-primary">
              <i class="fas fa-bookmark"></i> Book Now
            </button>
          `;
        } else if (slot.status === 'booked') {
          actions = `
            <button onclick="cancelBooking('${slotId}')" class="btn btn-warning">
              <i class="fas fa-times"></i> Cancel Booking
            </button>
          `;
        } else if (slot.status === 'occupied') {
          actions = `
            <button onclick="releaseSlot('${slotId}')" class="btn btn-danger">
              <i class="fas fa-door-open"></i> Release Slot
            </button>
          `;
        }
        
        // Timer
        let timerHtml = `<div class="timer-box" id="timer-${slotId}">`;
        if (slot.status === 'booked' && slot.bookingTime) {
          timerHtml += `<i class="fas fa-hourglass-half"></i> Waiting for vehicle...`;
          // Start timer
          timers[slotId] = setInterval(() => {
            const timer = document.getElementById(`timer-${slotId}`);
            if (timer) {
              const elapsed = Math.floor((Date.now() - parseInt(slot.bookingTime)) / 1000);
              const mins = Math.floor(elapsed / 60);
              const secs = elapsed % 60;
              timer.innerHTML = `<i class="fas fa-hourglass-half"></i> Pre-booking: ${mins}m ${secs}s`;
            }
          }, 1000);
        } else if (slot.status === 'occupied' && slot.occupyTime) {
          timerHtml += `<i class="fas fa-clock"></i> Parking duration: `;
          // Start timer
          timers[slotId] = setInterval(() => {
            const timer = document.getElementById(`timer-${slotId}`);
            if (timer) {
              const elapsed = Math.floor((Date.now() - parseInt(slot.occupyTime)) / 1000);
              const mins = Math.floor(elapsed / 60);
              const secs = elapsed % 60;
              timer.innerHTML = `<i class="fas fa-clock"></i> Parking: ${mins}m ${secs}s`;
            }
          }, 1000);
        }
        timerHtml += `</div>`;
        
        card.innerHTML = header + info + actions + timerHtml;
        grid.appendChild(card);
      });
    }

    // ============ RENDER LOGS ============
    function renderLogs(logs) {
      const tableBody = document.getElementById('logTableBody');
      tableBody.innerHTML = '';
      
      if (!logs || logs.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px;">No parking logs found</td></tr>';
        return;
      }
      
      logs.forEach(log => {
        const row = document.createElement('tr');
        const fee = calculateFee(log.occupyTime, log.vacateTime);
        const status = log.vacateTime ? 'Completed' : 'Active';
        
        row.innerHTML = `
          <td><strong>${log.slot || '-'}</strong></td>
          <td><span class="vehicle-tag">${log.vehicle || 'N/A'}</span></td>
          <td>${formatTime(log.bookingTime)}</td>
          <td>${log.preBookingDuration ? formatDuration(parseInt(log.preBookingDuration)) : '-'}</td>
          <td><span class="duration-tag">${log.parkingDuration ? formatDuration(parseInt(log.parkingDuration)) : 'Active'}</span></td>
          <td><span class="fee-tag">₹${fee}</span></td>
          <td><span style="color: ${status === 'Active' ? 'var(--warning)' : 'var(--success)'}">${status}</span></td>
        `;
        tableBody.appendChild(row);
      });
    }

    // ============ FILTER LOGS ============
    window.filterLogs = function() {
      const vehicleFilter = document.getElementById('filterVehicle').value.toLowerCase();
      const slotFilter = document.getElementById('filterSlot').value.toLowerCase();
      
      const filtered = allLogs.filter(log => {
        const matchVehicle = !vehicleFilter || (log.vehicle && log.vehicle.toLowerCase().includes(vehicleFilter));
        const matchSlot = !slotFilter || (log.slot && log.slot.toLowerCase().includes(slotFilter));
        return matchVehicle && matchSlot;
      });
      
      renderLogs(filtered);
    };

    // ============ CLEAR FILTERS ============
    window.clearFilters = function() {
      document.getElementById('filterVehicle').value = '';
      document.getElementById('filterSlot').value = '';
      renderLogs(allLogs);
    };

    // ============ EXPORT CSV ============
    window.exportCSV = function() {
      let csv = 'Slot,Vehicle,Booking Time,Pre-Booking Duration,Parking Duration,Fee (₹),Status\n';
      
      allLogs.forEach(log => {
        const fee = calculateFee(log.occupyTime, log.vacateTime);
        const status = log.vacateTime ? 'Completed' : 'Active';
        
        csv += `${log.slot || '-'},${log.vehicle || '-'},"${formatTime(log.bookingTime)}","${log.preBookingDuration ? formatDuration(parseInt(log.preBookingDuration)) : '-'}","${log.parkingDuration ? formatDuration(parseInt(log.parkingDuration)) : '-'}",${fee},${status}\n`;
      });
      
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `parking_logs_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      
      showNotification('📊 Logs exported successfully!', 'success');
    };

    // ============ UPDATE CURRENT TIME ============
    function updateCurrentTime() {
      const now = new Date();
      document.getElementById('currentTime').textContent = now.toLocaleTimeString('en-IN', { hour12: true });
    }
    setInterval(updateCurrentTime, 1000);

    // ============ CHECK SYSTEM HEALTH ============
    function checkSystemHealth() {
      const connected = firebase.database().ref('.info/connected');
      connected.on('value', (snap) => {
        if (snap.val() === true) {
          document.getElementById('wifiStatus').textContent = 'Connected';
          document.getElementById('wifiStatus').style.color = 'var(--success)';
        } else {
          document.getElementById('wifiStatus').textContent = 'Disconnected';
          document.getElementById('wifiStatus').style.color = 'var(--danger)';
        }
      });
    }

    // ============ INITIALIZE FIREBASE LISTENERS ============
    function initializeFirebase() {
      console.log('Initializing Firebase listeners...');
      
      // Listen to all slots
      database.ref('slots').on('value', (snapshot) => {
        const slotsData = snapshot.val();
        if (slotsData) {
          renderParkingSlots(slotsData);
          updateStatistics(slotsData);
        }
      }, (error) => {
        console.error('Slots listener error:', error);
        showNotification('⚠️ Firebase connection error', 'error');
      });
      
      // Listen to parking logs
      database.ref('parkingLogs').on('value', (snapshot) => {
        const logs = snapshot.val();
        if (logs) {
          allLogs = Object.values(logs)
            .filter(log => log.slot && log.vehicle)
            .sort((a, b) => parseInt(b.bookingTime || 0) - parseInt(a.bookingTime || 0));
          
          renderLogs(allLogs);
        }
      });
      
      // Listen to system events
      database.ref('systemEvents').limitToLast(1).on('child_added', (snapshot) => {
        const event = snapshot.val();
        if (event && event.event) {
          let message = `📢 ${event.event}`;
          if (event.vehicle) message += ` - ${event.vehicle}`;
          showNotification(message, 'info');
        }
      });
    }

    // ============ WINDOW LOAD ============
    window.onload = function() {
      console.log('🚀 Smart Parking System Starting...');
      initializeFirebase();
      checkSystemHealth();
      updateCurrentTime();
      showNotification('✅ System Ready!', 'success');
    };
  </script>
</body>
</html>
